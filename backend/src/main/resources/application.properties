# ---- Desarrollo local (H2 en archivo). Para EC2 se usa el perfil "prod" ----
server.port=${PORT:8081}
server.address=${SERVER_ADDRESS:0.0.0.0}
server.forward-headers-strategy=framework

spring.datasource.url=${DATABASE_URL:jdbc:h2:file:${user.home}/data/cultochaman;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

app.jwt.secret=${JWT_SECRET:dev-only-change-this-secret-key-at-least-32-bytes}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://127.0.0.1:5173}
app.admin.email=${ADMIN_EMAIL:admin@cultochaman.cl}
app.admin.password=${ADMIN_PASSWORD:Admin123!}
