# /etc/nginx/conf.d/cultochaman.conf
server {
    listen 80;
    server_name _;

    # Frontend compilado (npm run build -> carpeta dist)
    root /var/www/cultochaman;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }

    # API, Swagger y health-check hacia Spring Boot (solo escucha en 127.0.0.1:8081)
    location ~ ^/(api|swagger-ui|swagger-ui.html|v3|actuator/health) {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
