# Alternativa con Docker: API + MySQL en la misma EC2.
# Uso:  cp backend.env.example .env  (editar)  y luego:  docker compose up -d --build
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cultochaman
      MYSQL_USER: ${DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
  api:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile
    restart: unless-stopped
    depends_on: [db]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:mysql://db:3306/cultochaman?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
    ports:
      - "127.0.0.1:8081:8081"
volumes:
  dbdata:
